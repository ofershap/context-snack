name: Bug Report
description: Report a bug
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Install the package
        2. Call function X with arguments Y
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Version from the Extensions panel or package.json (e.g. 1.1.0).
    validations:
      required: true
  - type: input
    id: cursor-version
    attributes:
      label: Cursor / VS Code version
      description: Help → About (or equivalent).
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: OS
      description: e.g. macOS 15, Windows 11, Ubuntu 24.04
    validations:
      required: false
